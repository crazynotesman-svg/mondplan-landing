<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>MondPlan - Biodynamic Moon Calendar</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f24"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8e8a8"/>
      <stop offset="1" stop-color="#e8c878"/>
    </linearGradient>
    <radialGradient id="star" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#ffe898"/>
      <stop offset="1" stop-color="#ffe898" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Stars (background sparkles) -->
  <circle cx="6" cy="9" r="0.8" fill="#ffffff" opacity="0.7"/>
  <circle cx="54" cy="14" r="0.7" fill="#ffffff" opacity="0.6"/>
  <circle cx="11" cy="50" r="0.6" fill="#ffffff" opacity="0.5"/>
  <circle cx="56" cy="50" r="0.7" fill="#ffffff" opacity="0.6"/>
  <circle cx="50" cy="40" r="0.5" fill="#ffffff" opacity="0.5"/>
  <!-- Crescent moon (waning crescent, matching brand mark) -->
  <path d="M 30 12 a 22 22 0 1 0 12 38 a 18 18 0 1 1 -12 -38 z" fill="url(#moon)"/>
  <!-- Bright north-star style accent -->
  <circle cx="44" cy="20" r="6" fill="url(#star)"/>
  <circle cx="44" cy="20" r="1.4" fill="#ffffff"/>
  <line x1="44" y1="12" x2="44" y2="28" stroke="#ffe898" stroke-width="0.6" opacity="0.8"/>
  <line x1="36" y1="20" x2="52" y2="20" stroke="#ffe898" stroke-width="0.6" opacity="0.8"/>
  <line x1="38.5" y1="14.5" x2="49.5" y2="25.5" stroke="#ffe898" stroke-width="0.5" opacity="0.6"/>
  <line x1="49.5" y1="14.5" x2="38.5" y2="25.5" stroke="#ffe898" stroke-width="0.5" opacity="0.6"/>
</svg>
